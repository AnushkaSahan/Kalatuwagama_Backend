spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kalatuwagama_db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      fail-on-empty-beans: false

jwt:
  secret: ${JWT_SECRET:your-very-secure-secret-key-for-jwt-signing}
  expiration: 86400000  # 24 hours in milliseconds

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5174, https://yourfrontend.com
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method