spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Keep at least 1 connection open so Neon's compute doesn't see the
      # database as fully idle and auto-suspend between requests. Combined
      # with an external keep-alive ping (see /actuator/health), this stops
      # every request from paying a cold-start penalty.
      minimum-idle: 1
      maximum-pool-size: 5
      idle-timeout: 240000        # 4 min — stays under Neon's ~5 min autosuspend
      keepalive-time: 120000      # 2 min — periodic ping to keep the connection warm
      connection-timeout: 20000   # fail fast instead of hanging for the default 30s

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      fail-on-empty-beans: false

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_REQUEST_SIZE_MB:50}MB
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE_MB:50}MB

server:
  port: ${PORT:8080}

# Cloudinary — gallery image storage. Create a free account at
# https://cloudinary.com and set these as real environment variables in
# every environment (never commit real values).
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${438931845876294}
  api-secret: ${xCtS08jYqIj1AQXkjIHYsxbLO6I}
  # Folder inside the Cloudinary account where gallery uploads are stored.
  upload-folder: ${CLOUDINARY_UPLOAD_FOLDER:kalatuwagama/gallery}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET:your-very-secure-secret-key-for-jwt-signing}
  expiration: 86400000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5174}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  upload:
    # Per-file size cap enforced before anything is sent to Cloudinary.
    max-file-size-mb: ${UPLOAD_MAX_FILE_SIZE_MB:10}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method